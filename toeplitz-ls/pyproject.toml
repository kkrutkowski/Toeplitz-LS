[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toeplitz-ls"
version = "0.0.0"
description = "Python ctypes interface for the Toeplitz least-squares FastChi2 library."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
tlsdd = [
    "mpmath",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["toeplitz_ls*"]

[tool.setuptools.package-data]
toeplitz_ls = ["*.so"]
